<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f766e">
<title>阿羅拉・草叢散步｜寶可夢彈珠研究所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #ff6b5b; --teal: #0f9f8f; --deep: #0f4c5c; --sun: #ffc93c; --sand: #fff4dc;
  --ink: #1d3340; --soft: #5d7380; --card: #ffffffee; --line: #e7dcc4;
  --f: 'Fredoka', 'Noto Sans TC', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: var(--f); color: var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #ffe9a8 0 12%, transparent 30%),
    radial-gradient(circle at 92% 92%, #8ee3d4 0 14%, transparent 38%),
    linear-gradient(160deg, #fff1cf 0%, #ffd9c2 45%, #a8e6db 100%);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }

#app {
  height: 100vh; height: 100dvh; display: grid;
  grid-template: "stage" 1fr "recent" 58px "bar" calc(60px + env(safe-area-inset-bottom)) / 100%;
}
#left { display: none; }
#stage { grid-area: stage; position: relative; overflow: hidden; touch-action: none; background: #7dd3c7; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#right { grid-area: recent; background: #fffaf0; border-top: 2px solid var(--line); overflow: hidden; }
#right h3 { display: none; }
#bar {
  grid-area: bar; display: flex; justify-content: space-around; align-items: flex-start; gap: 2px;
  padding: 6px 6px env(safe-area-inset-bottom); background: var(--deep);
}
.bb {
  flex: 1; max-width: 70px; height: 48px; border-radius: 14px; background: #ffffff14; color: #e8fbf7;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 19px; line-height: 1;
}
.bb small { font-size: 10px; font-weight: 700; letter-spacing: .05em; opacity: .85; font-family: 'Noto Sans TC', sans-serif; }
.bb.on { background: var(--sun); color: var(--deep); }
.bb:active { transform: scale(.94); }

/* 最近抓到（手機：橫條） */
#recent { display: flex; gap: 6px; padding: 5px 8px; overflow-x: auto; height: 100%; align-items: center; scrollbar-width: none; }
#recent::-webkit-scrollbar { display: none; }
.ri { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; background: #fff; border: 2px solid var(--line); position: relative; display: grid; place-items: center; }
.ri img { width: 42px; height: 42px; object-fit: contain; }
.ri .rn { display: none; }
.ri.rare { border-color: #60a5fa; } .ri.srare { border-color: #f59e0b; } .ri.legend { border-color: #a855f7; }
.ri .sh { position: absolute; top: -5px; right: -4px; font-size: 12px; }
.empty-r { color: var(--soft); font-size: 13px; padding: 0 6px; font-family: 'Noto Sans TC', sans-serif; }

/* 桌機 */
@media (min-width: 1000px) {
  #app { grid-template: "left stage right" 1fr / clamp(184px, 17vw, 240px) minmax(0, 1fr) clamp(184px, 17vw, 240px); gap: 16px; padding: 16px; }
  #bar { display: none; }
  #left { grid-area: left; } #right { grid-area: right; }
  #stage { align-self: center; width: 100%; aspect-ratio: 3 / 2; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); border-radius: 26px; box-shadow: 0 18px 40px #0f4c5c40, 0 0 0 6px #fff; }
  #left, #right { display: flex; flex-direction: column; gap: 12px; min-height: 0; background: var(--card); border-radius: 24px; padding: 16px; box-shadow: 0 10px 30px #0f4c5c22; border: 0; }
  #right h3 { display: block; margin: 0; font-size: 15px; font-family: 'Noto Sans TC', sans-serif; }
  #recent { flex-direction: column; overflow-y: auto; overflow-x: hidden; align-items: stretch; padding: 0; gap: 6px; height: auto; flex: 1; }
  .ri { width: auto; height: 52px; display: flex; justify-content: flex-start; gap: 8px; padding: 0 8px 0 2px; }
  .ri img { width: 48px; height: 48px; }
  .ri .rn { display: block; font-size: 13px; line-height: 1.25; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; }
  .ri .rn b { display: block; font-family: var(--f); color: var(--soft); font-size: 12px; font-weight: 600; }
  .ri .sh { top: 4px; right: 6px; }
}
.brand { line-height: 1.1; }
.brand b { display: block; font-size: 22px; font-weight: 900; font-family: 'Noto Sans TC', sans-serif; color: var(--deep); }
.brand span { font-size: 13px; letter-spacing: .18em; color: var(--coral); font-weight: 700; }
.isl { display: flex; flex-direction: column; gap: 6px; }
.isl div { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 14px; background: #f7f1e3; font-size: 14px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; }
.isl div i { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
.isl div em { margin-left: auto; font-style: normal; font-family: var(--f); font-weight: 600; color: var(--soft); font-size: 13px; }
.isl div.cur { background: var(--deep); color: #fff; }
.isl div.cur em { color: #bff3ea; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stats div { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 6px 8px; font-size: 12px; color: var(--soft); font-family: 'Noto Sans TC', sans-serif; font-weight: 700; }
.stats div b { display: block; font-family: var(--f); color: var(--ink); font-size: 20px; font-weight: 700; }
.sw { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; padding: 2px 2px; }
.sw button { width: 46px; height: 26px; border-radius: 13px; background: #d6cfc0; position: relative; transition: background .2s; }
.sw button::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px #0003; }
.sw button.on { background: var(--teal); }
.sw button.on::after { transform: translateX(20px); }
.lbtn { height: 44px; border-radius: 14px; background: var(--deep); color: #fff; font-size: 15px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; }
.lbtn.alt { background: #fff; color: var(--deep); border: 2px solid var(--line); }
.lbtn.coral { background: var(--coral); }
.lbtn:active { transform: scale(.97); }
.grow { flex: 1; }

/* 場景上的 HUD */
.hud { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; }
.chip { background: #ffffffdd; border-radius: 16px; padding: 6px 12px; box-shadow: 0 3px 10px #0002; font-weight: 700; }
.ichip { min-width: 128px; }
.ichip .nm { font-size: 15px; font-family: 'Noto Sans TC', sans-serif; font-weight: 900; display: flex; align-items: center; gap: 6px; }
.ichip .nm i { width: 10px; height: 10px; border-radius: 50%; }
.ichip .pg { height: 6px; border-radius: 3px; background: #0001; margin-top: 4px; overflow: hidden; }
.ichip .pg b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--sun)); border-radius: 3px; }
.rchips { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.dchip { font-size: 18px; }
.dchip small { font-size: 12px; color: var(--soft); }
.bait { background: #fff1c2; font-size: 13px; display: none; }
.bait.on { display: block; animation: wob 1.2s ease-in-out infinite; }
.auto { font-size: 11px; letter-spacing: .1em; background: var(--teal); color: #fff; padding: 3px 9px; }
.auto.off { background: #64748b; }
@keyframes wob { 50% { transform: rotate(-4deg) scale(1.05); } }
.hint { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); background: #ffffffe6; padding: 8px 16px; border-radius: 20px; font-weight: 900; font-size: 15px; font-family: 'Noto Sans TC', sans-serif; pointer-events: none; opacity: 0; transition: opacity .2s; box-shadow: 0 4px 12px #0002; white-space: nowrap; }
.hint.show { opacity: 1; animation: bounce .8s ease-in-out infinite; }
@keyframes bounce { 50% { transform: translate(-50%, -6px); } }
.snd { position: absolute; left: 10px; bottom: 10px; font-size: 12px; background: #0f4c5ccc; color: #fff; padding: 5px 10px; border-radius: 12px; pointer-events: none; font-family: 'Noto Sans TC', sans-serif; transition: opacity .4s; }
.snd.hide { opacity: 0; }

/* 抓到卡片 */
.card {
  position: absolute; left: 50%; top: 22%; width: 190px; transform: translate(-50%, -20px) scale(.6); opacity: 0;
  background: #fff; border-radius: 22px; padding: 10px 12px 12px; text-align: center; pointer-events: none;
  box-shadow: 0 10px 30px #0004, 0 0 0 4px #fff, 0 0 0 7px var(--tc, #9fd9a0); transition: transform .35s cubic-bezier(.2, 1.6, .4, 1), opacity .25s;
}
.card.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
.card .ct { display: inline-block; font-size: 12px; font-weight: 900; color: #fff; background: var(--tc, #22a35a); padding: 2px 10px; border-radius: 10px; font-family: 'Noto Sans TC', sans-serif; }
.card img { width: 110px; height: 110px; object-fit: contain; display: block; margin: 2px auto 0; }
.card .cno { font-size: 14px; color: var(--soft); font-weight: 600; }
.card .cnm { font-size: 20px; font-weight: 900; font-family: 'Noto Sans TC', sans-serif; }
.card .nw { position: absolute; top: -10px; right: -8px; background: var(--coral); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 10px; transform: rotate(8deg); }
.card.rare { --tc: #3b82f6; } .card.srare { --tc: #f59e0b; } .card.legend { --tc: #9333ea; }
.card.shiny { background: linear-gradient(135deg, #fff, #fff6d6, #ffe4f1, #e0f2fe); }

/* 聚光燈（超稀有、傳說、閃光） */
.spot { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle, #1e1b4bcc, #0b0820f2); color: #fff; overflow: hidden; z-index: 5; }
.spot.show { display: flex; animation: fin .3s; }
@keyframes fin { from { opacity: 0; } }
.spot .rays { position: absolute; left: 50%; top: 45%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; background: repeating-conic-gradient(from 0deg, var(--ray, #ffd16633) 0 8deg, transparent 8deg 20deg); animation: spin 12s linear infinite; border-radius: 50%; mask: radial-gradient(circle, #000 0 20%, transparent 60%); -webkit-mask: radial-gradient(circle, #000 0 20%, transparent 60%); }
@keyframes spin { to { transform: rotate(360deg); } }
.spot .sh { position: relative; font-size: 15px; font-weight: 900; letter-spacing: .1em; color: var(--hint, #ffd166); font-family: 'Noto Sans TC', sans-serif; }
.spot img { position: relative; width: min(52vw, 220px); height: min(52vw, 220px); object-fit: contain; filter: drop-shadow(0 0 24px var(--hint, #ffd166)); animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(.2); } }
.spot .sn { position: relative; font-size: 32px; font-weight: 900; font-family: 'Noto Sans TC', sans-serif; text-shadow: 0 3px 0 #0006; }
.spot .sm { position: relative; font-size: 16px; color: #e0e7ff; margin-top: 2px; }
.spot .tap { position: absolute; bottom: 14px; font-size: 12px; opacity: .6; font-family: 'Noto Sans TC', sans-serif; }

/* 進化 */
.evo { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle, #ecfeffee, #67e8f9cc 60%, #0e7490dd); z-index: 6; gap: 6px; }
.evo.show { display: flex; animation: fin .3s; }
.evo .row { position: relative; width: 200px; height: 200px; }
.evo .row img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.evo .row .a { animation: evoA 2s ease-in forwards; }
.evo .row .b { opacity: 0; animation: evoB 2s ease-in forwards; }
@keyframes evoA { 0% { filter: brightness(1); } 40% { filter: brightness(0) invert(1); transform: scale(1); } 70% { transform: scale(.4); opacity: 1; } 75%, 100% { opacity: 0; transform: scale(.4); filter: brightness(0) invert(1); } }
@keyframes evoB { 0%, 70% { opacity: 0; transform: scale(.4); filter: brightness(0) invert(1); } 80% { opacity: 1; transform: scale(1.15); filter: brightness(0) invert(1); } 100% { opacity: 1; transform: scale(1); filter: none; } }
.evo .t { font-size: 22px; font-weight: 900; font-family: 'Noto Sans TC', sans-serif; color: var(--deep); background: #fff; padding: 6px 18px; border-radius: 20px; }
.evo .t b { color: var(--coral); }

.flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 7; }
.flash.go { animation: flash .6s ease-out; }
.flash.rainbow { background: conic-gradient(#ff6b6b, #ffd93d, #6bff95, #6bc5ff, #c56bff, #ff6b6b); }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

.toast { position: absolute; left: 50%; top: 64px; transform: translate(-50%, -10px); background: var(--deep); color: #fff; padding: 8px 16px; border-radius: 16px; font-size: 14px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; opacity: 0; transition: .3s; pointer-events: none; white-space: nowrap; z-index: 4; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.paused { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; background: #0f4c5c99; z-index: 8; color: #fff; }
.paused.show { display: flex; }
.paused b { font-size: 30px; font-family: 'Noto Sans TC', sans-serif; }
.paused button { background: var(--sun); color: var(--deep); font-size: 18px; font-weight: 900; padding: 12px 28px; border-radius: 22px; font-family: 'Noto Sans TC', sans-serif; }

/* 圖鑑 */
.modal { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #0f4c5c88; padding: 12px; }
.modal.show { display: flex; }
.sheet { width: min(980px, 100%); height: min(760px, 100%); background: #fffaf0; border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px #0005; }
.dh { display: flex; align-items: center; gap: 10px; padding: 12px 14px 6px; flex-wrap: wrap; }
.dh h2 { margin: 0; font-size: 20px; font-family: 'Noto Sans TC', sans-serif; font-weight: 900; color: var(--deep); }
.dh .cnt { font-size: 14px; color: var(--soft); font-weight: 600; }
.dh .cnt b { color: var(--ink); font-size: 17px; }
.dh .x { margin-left: auto; width: 38px; height: 38px; border-radius: 50%; background: var(--deep); color: #fff; font-size: 18px; }
.tabs { display: flex; gap: 6px; padding: 4px 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 0 0 auto; padding: 6px 12px; border-radius: 14px; background: #fff; border: 2px solid var(--line); font-size: 13px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; }
.tabs button.on { background: var(--teal); color: #fff; border-color: var(--teal); }
.dbox { flex: 1; min-height: 0; padding: 8px 14px; }
.dgrid { display: grid; gap: 6px; height: 100%; }
.dcell { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; overflow: hidden; padding: 2px; }
.dcell img { width: 100%; flex: 1; min-height: 0; object-fit: contain; }
.dcell .n { position: absolute; top: 3px; left: 6px; font-size: 11px; font-weight: 600; color: var(--soft); }
.dcell .c { position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 600; color: var(--teal); }
.dcell .st { position: absolute; bottom: 18px; right: 4px; font-size: 12px; }
.dcell .nm { font-size: 11px; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.dcell.miss img { filter: brightness(0); opacity: .14; }
.dcell.miss .nm { color: #b8ad96; }
.dcell.gotS { cursor: pointer; }
.dcell.sh { background: linear-gradient(135deg, #fff, #fff4cc, #ffe4f1); border-color: #f5c542; }
.dcell.rare { border-color: #bcd6ff; } .dcell.srare { border-color: #fcd68a; } .dcell.legend { border-color: #d8b4fe; }
.dcell.miss { border-color: var(--line); }
.dfoot { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 8px 14px 12px; }
.dfoot button { width: 46px; height: 40px; border-radius: 14px; background: var(--deep); color: #fff; font-size: 20px; }
.dfoot span { font-weight: 700; min-width: 64px; text-align: center; }
.dfoot small { color: var(--soft); font-family: 'Noto Sans TC', sans-serif; font-size: 12px; }
@media (max-width: 600px) { .modal { padding: 0; } .sheet { border-radius: 0; height: 100%; } .card { width: 160px; top: 18%; } .card img { width: 92px; height: 92px; } }
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <div class="brand"><b>阿羅拉・草叢散步</b><span>ALOLA · 403</span></div>
    <div class="isl" id="islList"></div>
    <div class="stats">
      <div>圖鑑<b data-k="dex">0</b></div>
      <div>閃光<b data-k="shiny">0</b></div>
      <div>傳說・究極<b data-k="ultra">0</b></div>
      <div>超級餌<b data-k="bait">0</b></div>
    </div>
    <div class="sw">自動丟球<button data-sw="auto"></button></div>
    <div class="sw">音樂<button data-sw="music"></button></div>
    <div class="sw">音效<button data-sw="sfx"></button></div>
    <div class="grow"></div>
    <button class="lbtn coral" data-act="dex">📖 阿羅拉圖鑑</button>
    <button class="lbtn alt" data-act="pause">⏸ 暫停</button>
    <button class="lbtn" data-act="home">🏠 回大廳</button>
  </aside>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="chip ichip"><div class="nm"><i id="isDot"></i><span id="isName">美樂美樂島</span></div><div class="pg"><b id="isProg"></b></div></div>
      <div class="rchips">
        <div class="chip dchip">📖 <span data-k="dex">0</span><small>/403</small></div>
        <div class="chip bait" id="baitChip">🍯 超級餌 ×<span data-k="bait">0</span></div>
        <div class="chip auto" id="autoChip">AUTO</div>
      </div>
    </div>
    <div class="hint" id="hint">點畫面丟球！</div>
    <div class="snd" id="sndHint">🔈 點一下畫面開聲音</div>
    <div class="card" id="card"><span class="nw" id="cNew">NEW</span><div class="ct" id="cTier">普通</div><img id="cImg" alt=""><div class="cno" id="cNo">#001</div><div class="cnm" id="cName">？</div></div>
    <div class="spot" id="spot"><div class="rays"></div><div class="sh" id="spHint"></div><img id="spImg" alt=""><div class="sn" id="spName"></div><div class="sm" id="spMeta"></div><div class="tap">點一下繼續</div></div>
    <div class="evo" id="evo"><div class="t">咦？<b id="evFrom"></b> 的樣子……</div><div class="row"><img class="a" id="evA" alt=""><img class="b" id="evB" alt=""></div><div class="t" id="evText"></div></div>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
    <div class="paused" id="paused"><b>暫停中</b><button id="resumeBtn">▶ 繼續散步</button></div>
  </main>

  <aside id="right"><h3>最近抓到</h3><div id="recent"></div></aside>

  <nav id="bar">
    <button class="bb" data-act="home">🏠<small>大廳</small></button>
    <button class="bb" data-act="dex">📖<small>圖鑑</small></button>
    <button class="bb" data-sw="auto">🤖<small>自動</small></button>
    <button class="bb" data-act="pause">⏸<small>暫停</small></button>
    <button class="bb" data-sw="music">🎵<small>音樂</small></button>
    <button class="bb" data-sw="sfx">🔊<small>音效</small></button>
  </nav>
</div>

<div class="modal" id="dex">
  <div class="sheet">
    <div class="dh"><h2>阿羅拉圖鑑</h2><span class="cnt" id="dxCnt"></span><button class="x" id="dxClose">✕</button></div>
    <div class="tabs" id="dxIsl"></div>
    <div class="tabs" id="dxFil"></div>
    <div class="dbox"><div class="dgrid" id="dxGrid"></div></div>
    <div class="dfoot"><button id="dxPrev">‹</button><span id="dxPage">1/1</span><button id="dxNext">›</button><small>點閃光的格子可切換</small></div>
  </div>
</div>

<script src="data.js"></script>
<script src="../shared/collect.js"></script>
<script src="game.js"></script>
</body>
</html>
