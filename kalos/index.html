<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120f2c">
<title>卡洛斯卡包研究所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#120f2c; --ink2:#1d1844; --pink:#ff6fae; --rose:#e8467c; --blue:#4aa8ff; --sky:#9fdcff; --gold:#f0cf7a; --gold2:#b8862b;
  --txt:#fbf6ff; --mut:#b6add8; --line:rgba(255,255,255,.14);
  --silver:linear-gradient(135deg,#f7f8fb 0%,#a9adbb 22%,#eef0f5 45%,#868b9b 70%,#e9ebf1 100%);
  --goldm:linear-gradient(135deg,#fff3c4 0%,#d8a94a 25%,#fff0b0 48%,#a8761f 72%,#ffe39a 100%);
  --rainbow:linear-gradient(115deg,#ff6fae,#ffb86b,#fff27a,#7cf2a6,#6fd8ff,#a58bff,#ff6fae);
  --serif:"Cormorant Garamond","Noto Sans TC",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--txt);font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--ink)}
body{background:
  radial-gradient(ellipse 70% 55% at 15% 0%,rgba(255,111,174,.30) 0%,transparent 60%),
  radial-gradient(ellipse 70% 55% at 85% 100%,rgba(74,168,255,.30) 0%,transparent 60%),
  linear-gradient(160deg,#1a1440 0%,#120f2c 55%,#0d1230 100%)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none;padding:0}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none}

/* 背景：巴黎鐵塔細線 */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco svg{position:absolute;bottom:0;height:88%;opacity:.17;stroke:#f3dcae;fill:none;stroke-width:1.1}
.deco .t1{left:-40px}
.deco .t2{right:-40px;transform:scaleX(-1);opacity:.12}
.deco .sun{position:absolute;left:50%;top:-260px;width:620px;height:620px;transform:translateX(-50%);border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(240,207,122,.07) 0 2deg,transparent 2deg 9deg);
  -webkit-mask:radial-gradient(circle,transparent 30%,#000 31%,#000 60%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 31%,#000 60%,transparent 70%)}

/* 頂列：金屬邊框 */
.top{position:relative;z-index:5;display:flex;align-items:center;gap:8px;margin:8px 8px 0;padding:6px 8px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid transparent;
  background-clip:padding-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 24px rgba(0,0,0,.35)}
.top::before{content:"";position:absolute;inset:-1px;border-radius:17px;padding:1.5px;background:linear-gradient(90deg,var(--pink),#e9ebf1 30%,#8e93a3 50%,#e9ebf1 70%,var(--blue));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto}
.xy{width:34px;height:34px;flex:none;position:relative;border-radius:50%;background:conic-gradient(from 45deg,var(--blue) 0 50%,var(--rose) 50% 100%);box-shadow:0 0 0 2px #e9ebf1,0 0 14px rgba(255,111,174,.5)}
.xy::after{content:"";position:absolute;inset:8px;border:2px solid #fff;transform:rotate(45deg);border-radius:3px}
.brand>div{min-width:0;overflow:hidden}
.brand b{display:block;font-size:16px;font-weight:900;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:italic 600 12px var(--serif);color:var(--gold);letter-spacing:3px;white-space:nowrap}
.dexchip{display:flex;align-items:baseline;gap:3px;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);white-space:nowrap}
.dexchip small{font-size:10px;color:var(--mut);margin-right:3px}
.dexchip b{font:700 24px/1 var(--serif);color:#fff}
.dexchip span{font:600 14px var(--serif);color:var(--mut)}
.hbtn{display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}
.hbtn:active,.ibtn:active{transform:scale(.94)}
.ibtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
.ibtn.off{opacity:.38;text-decoration:line-through}
#btnBinder{background:linear-gradient(135deg,rgba(255,111,174,.35),rgba(74,168,255,.35));border-color:rgba(255,255,255,.3)}
#btnBinder.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}

/* 主區 */
.main{position:relative;z-index:2;flex:1;min-height:0;display:flex;gap:10px;padding:8px}
.stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column}
.counter{flex:none;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.counter span{padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:rgba(0,0,0,.2)}
.counter b{font:700 16px var(--serif);color:#fff;margin:0 2px}
.counter .sp b{color:var(--gold)} .counter .lg b{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.counter .due{border-color:var(--gold);color:#fff;animation:glowc 1.4s infinite}
@keyframes glowc{50%{box-shadow:0 0 14px rgba(240,207,122,.7)}}
#table{position:relative;flex:1;min-height:0;touch-action:none}
.hint{flex:none;text-align:center;font-size:13px;color:var(--mut);height:22px;letter-spacing:1px}
.hint b{color:#fff}

/* 卡包 */
.pack{position:absolute;left:0;top:0;transform-origin:50% 50%;transition:transform .55s cubic-bezier(.2,.9,.25,1),opacity .4s;filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));cursor:pointer;will-change:transform}
.pack.dim{opacity:.18;pointer-events:none}
.pack.gone{opacity:0;pointer-events:none}
.pack.held{cursor:grab}
.pack:not(.held):hover .pk-body{filter:brightness(1.1)}
.pk-top,.pk-body{position:absolute;left:0;width:100%;overflow:hidden}
.pk-top{top:0;height:15%;z-index:2;transition:transform .5s cubic-bezier(.3,.7,.4,1),opacity .5s}
.pk-body{top:13%;height:87%}
.pk-top .crimp,.pk-body .crimp{position:absolute;left:0;right:0;height:9%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,rgba(0,0,0,.12) 2px 5px)}
.pk-top .crimp{top:0;height:62%}
.pk-body .crimp.b{bottom:0}
.pk-top em{position:absolute;left:0;right:0;bottom:16%;text-align:center;font:italic 700 .8em var(--serif);letter-spacing:.3em;color:rgba(255,255,255,.8)}
.pack .pk-top,.pack .pk-body{background:var(--pk)}
.pack.s0{--pk:linear-gradient(160deg,#ff8cc0 0%,#e8467c 45%,#8d1f5a 100%);--accent:#ffd1e6}
.pack.s1{--pk:linear-gradient(160deg,#8fe3ff 0%,#2f8cf0 45%,#16367f 100%);--accent:#d4f2ff}
.pack.s2{--pk:linear-gradient(160deg,#c9b2ff 0%,#6b54d6 45%,#2a1f63 100%);--accent:#e6dcff}
.pack.special{--pk:linear-gradient(160deg,#fff3c4 0%,#e3b44f 30%,#fff0b0 50%,#a8761f 78%,#ffe39a 100%);--accent:#fff7db}
.pack.legend{--pk:linear-gradient(115deg,#ff6fae,#ffb86b,#fff27a,#7cf2a6,#6fd8ff,#a58bff,#ff6fae);--accent:#fff}
.pack.legend .pk-top,.pack.legend .pk-body{background-size:300% 100%;animation:rb 4s linear infinite}
@keyframes rb{to{background-position:300% 0}}
.pk-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.6s ease-in-out infinite;mix-blend-mode:overlay}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.pk-frame{position:absolute;inset:11% 7% 9%;border:1px solid rgba(255,255,255,.55);border-radius:8px}
.pk-frame::before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.3);border-radius:5px}
.pk-logo{position:absolute;top:13%;left:0;right:0;text-align:center;font:italic 700 1.05em var(--serif);letter-spacing:.45em;color:var(--accent);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pk-star{position:absolute;left:12%;width:76%;top:21%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.pk-tower{position:absolute;left:50%;top:18%;height:56%;transform:translateX(-50%);stroke:rgba(255,255,255,.35);fill:none;stroke-width:1.2}
.pk-title{position:absolute;left:0;right:0;bottom:19%;text-align:center;font-weight:900;font-size:1.7em;letter-spacing:.2em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.pk-en{position:absolute;left:0;right:0;bottom:12.5%;text-align:center;font:italic 700 .9em var(--serif);letter-spacing:.25em;color:var(--accent)}
.pk-ribbon{display:none;position:absolute;top:35%;right:-30%;width:100%;padding:3px 0;transform:rotate(38deg);text-align:center;font-size:.95em;font-weight:900;letter-spacing:.15em;color:#4a2a00;background:#fff3c4;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pack.special .pk-ribbon,.pack.legend .pk-ribbon{display:block}
.pack.legend .pk-ribbon{color:#3b1060;background:#fff}
.pack.special .pk-title,.pack.special .pk-en{color:#5a3700;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.pack.special .pk-logo{color:#7a4c00;text-shadow:none}
.pack.legend .pk-title{color:#fff;text-shadow:0 0 6px #6a2aa0,0 2px 6px rgba(0,0,0,.5)}
.pack.legend .pk-logo,.pack.legend .pk-en{color:#2a0f4f;text-shadow:0 0 4px #fff}
.pack.wobble{animation:wob .5s}
@keyframes wob{25%{rotate:-3deg}75%{rotate:3deg}}
.pack.enter{animation:pkIn .6s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pkIn{from{translate:0 120%;opacity:0}}
.pack .pullHint{position:absolute;left:50%;top:-2.6em;transform:translateX(-50%);font-size:.8em;font-weight:700;white-space:nowrap;color:#fff;opacity:0;transition:opacity .3s;pointer-events:none}
.pack.held .pullHint{opacity:1;animation:up 1.2s ease-in-out infinite}
@keyframes up{50%{translate:0 -6px}}

/* 卡片 */
.card{position:absolute;left:0;top:0;perspective:1100px;transition:transform .6s cubic-bezier(.2,.9,.25,1),opacity .4s;will-change:transform;cursor:pointer}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.card .back,.card .face{position:absolute;inset:0;border-radius:6.5%/4.7%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;isolation:isolate}
.card .face{transform:rotateY(180deg)}
.card .back{background:
   radial-gradient(circle at 50% 50%,transparent 21%,rgba(255,255,255,.85) 21.5% 23%,transparent 23.5%),
   conic-gradient(from 225deg at 50% 50%,#2f6fe0 0 50%,#d6386f 50% 100%);
  box-shadow:inset 0 0 0 4px #e9ebf1,inset 0 0 0 6px #8e93a3,inset 0 0 0 9px #f4f5f8,0 6px 14px rgba(0,0,0,.4)}
.card .back::before{content:"";position:absolute;inset:14%;border:1.5px solid rgba(255,255,255,.55);border-radius:6px}
.card .back::after{content:"";position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);border:3px solid #fff;border-radius:4px;box-shadow:0 0 12px rgba(255,255,255,.6)}
.card .back i{position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 9px)}
.card .back b{position:absolute;left:0;right:0;bottom:16%;text-align:center;font:italic 700 calc(var(--cw) * .085) var(--serif);letter-spacing:.3em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.card.glow .back{animation:edge .5s ease-in-out infinite alternate}
.card.glow.g1 .back{--gl:#dfe6ff} .card.glow.g2 .back{--gl:#ffd25e} .card.glow.g3 .back{--gl:#ff7cf0}
@keyframes edge{from{box-shadow:inset 0 0 0 4px #e9ebf1,inset 0 0 0 6px #8e93a3,0 0 10px 2px var(--gl)}to{box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 6px var(--gl),0 0 34px 10px var(--gl)}}
.card.shake{animation:cshake .12s linear infinite}
@keyframes cshake{25%{translate:-2px 0}75%{translate:2px 0}}

/* 卡面 */
.face{--fr:#f6f3ec;background:var(--fr);padding:4.2%;font-size:calc(var(--cw) * .072)}
.face.t-rare{--fr:var(--silver)}
.face.t-srare{--fr:var(--goldm)}
.face.t-legend{--fr:var(--rainbow);background-size:300% 300%;animation:rb2 5s linear infinite}
@keyframes rb2{to{background-position:300% 300%}}
.fc{position:relative;height:100%;border-radius:4.5%/3.2%;overflow:hidden;background:linear-gradient(180deg,#fffaf5,#f1ecf7);color:#21183f;display:flex;flex-direction:column}
.face.t-legend .fc{background:linear-gradient(180deg,#fff,#efe9ff)}
.ftop{display:flex;align-items:baseline;gap:.3em;padding:.35em .45em .2em;line-height:1.1}
.ftop .nm{font-weight:900;font-size:1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ftop .no{font:700 1em var(--serif);color:#6a5f8c}
.art{position:relative;margin:0 .45em;aspect-ratio:1.25;border-radius:3px;overflow:hidden;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.85),transparent 70%),linear-gradient(160deg,var(--t1),var(--t2));box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.art img{position:absolute;left:12%;top:2%;width:76%;height:96%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.holo{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:color-dodge;
  background:repeating-linear-gradient(110deg,#ff6fae 0%,#ffe27a 6%,#7cf2a6 12%,#6fd8ff 18%,#a58bff 24%,#ff6fae 30%);
  background-size:300% 300%;background-position:calc(var(--mx,.5) * 100%) calc(var(--my,.5) * 100%)}
.face.t-rare .art .holo{opacity:.32}
.face.t-srare .art .holo{opacity:.5}
.face.t-legend .art .holo{opacity:.6}
.finfo{display:flex;align-items:center;gap:.3em;padding:.35em .45em .1em;flex-wrap:wrap}
.ty{font-size:.66em;font-weight:700;color:#fff;padding:.1em .45em;border-radius:99px;background:var(--c);white-space:nowrap}
.stars{margin-left:auto;font-size:.8em;letter-spacing:-.05em;color:#c9a227}
.face.t-rare .stars{color:#7d8394} .face.t-legend .stars{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}
.fmeta{display:flex;justify-content:space-between;margin:.3em .45em 0;padding:.25em .4em;font-size:.6em;color:#6a5f8c;border-radius:3px;background:linear-gradient(90deg,rgba(255,111,174,.12),rgba(74,168,255,.12))}
.fdesc{margin:auto .45em .2em;padding-top:.2em;border-top:1px solid rgba(33,24,63,.15);display:flex;justify-content:space-between;align-items:center;font-size:.62em;color:#6a5f8c}
.fdesc .set{display:flex;align-items:center;gap:.25em;font-weight:700}
.fdesc .set i{width:.95em;height:.95em;border-radius:50%;background:var(--sc)}
.fdesc .tier{font-weight:900;letter-spacing:.05em}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.9;
  background:radial-gradient(circle at calc(var(--mx,.5) * 100%) calc(var(--my,.5) * 100%),rgba(255,255,255,.95) 0%,rgba(255,255,255,.25) 28%,transparent 55%)}
.foil{position:absolute;inset:0;pointer-events:none;display:none;mix-blend-mode:color-dodge;opacity:.55;
  background:
    radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px) 0 0/13px 13px,
    radial-gradient(circle at 70% 60%,#fff 0 1px,transparent 1.5px) 0 0/17px 17px,
    repeating-linear-gradient(125deg,#ff6fae 0%,#ffe27a 5%,#7cf2a6 10%,#6fd8ff 15%,#a58bff 20%,#ff6fae 25%);
  background-size:13px 13px,17px 17px,400% 400%;
  background-position:0 0,0 0,calc(var(--mx,.5) * 100%) calc(var(--my,.5) * 100%)}
.face.shiny .foil{display:block}
.face.shiny .ftop .nm::after{content:" ✦";color:#e0a400}
.newtag{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);opacity:0;padding:.25em .7em;border:3px double var(--rose);border-radius:6px;color:var(--rose);background:rgba(255,255,255,.85);font-weight:900;font-size:1.1em;letter-spacing:.1em;white-space:nowrap;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s;pointer-events:none;z-index:3}
.newtag.on{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}

/* 特寫揭曉 */
.ov{position:fixed;inset:0;z-index:30;display:none}
.ov.on{display:block}
#zoom{z-index:32}#spot,#evo{z-index:34}
#spot{background:radial-gradient(circle at 50% 45%,rgba(30,16,60,.6),rgba(6,4,18,.92));animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
#spot .rays{position:absolute;left:50%;top:45%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(from 0deg,var(--ray) 0 6deg,transparent 6deg 18deg);animation:spin 18s linear infinite;opacity:.22;-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%)}
@keyframes spin{to{transform:rotate(360deg)}}
#spot .sc{position:absolute;left:50%;top:45%}
#spot .lab{position:absolute;left:0;right:0;text-align:center;top:6%;font:italic 700 clamp(26px,6vw,46px) var(--serif);letter-spacing:.12em;background:var(--lg);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 8px rgba(0,0,0,.6));animation:labIn .6s cubic-bezier(.2,1.5,.4,1) both}
#spot .sub{position:absolute;left:0;right:0;bottom:7%;text-align:center;font-size:15px;color:var(--mut)}
#spot .sub b{color:#fff;font-size:22px;display:block;margin-bottom:4px}
@keyframes labIn{from{transform:scale(.4);opacity:0}}

/* 進化 */
#evo{background:rgba(6,4,18,.88)}
#evo .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);text-align:center}
#evo .pic{position:relative;width:200px;height:200px;margin:0 auto}
#evo .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#evo .pic .from{animation:evFrom 1.6s forwards}
#evo .pic .to{opacity:0;animation:evTo 1.6s forwards}
@keyframes evFrom{0%{filter:brightness(1)}20%,45%,70%{filter:brightness(4)}30%,55%{filter:brightness(1.4)}80%{filter:brightness(6);opacity:1}90%,100%{opacity:0}}
@keyframes evTo{0%,78%{opacity:0;filter:brightness(6)}100%{opacity:1;filter:brightness(1)}}
#evo .flash{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,#fff,transparent 65%);opacity:0;animation:evFl 1.6s forwards}
@keyframes evFl{0%,70%{opacity:0}82%{opacity:1}100%{opacity:0}}
#evo h3{font:italic 700 34px var(--serif);letter-spacing:.2em;margin:0 0 8px;background:linear-gradient(90deg,var(--pink),#fff,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
#evo p{margin:10px 0 0;font-size:16px;opacity:0;animation:fadeUp .4s 1.5s forwards}
#evo p b{color:var(--gold)}
#evo .nw{display:inline-block;margin-left:6px;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--rose);color:#fff;vertical-align:middle}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 卡冊 */
#binder{background:rgba(6,4,18,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.bk{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,1060px);height:min(94dvh,820px);display:flex;flex-direction:column;padding:12px;border-radius:18px;
  background:linear-gradient(135deg,#3a1f4f,#22163f 50%,#152a55);box-shadow:0 0 0 2px #c9ccd6,0 0 0 4px #4b4f60,0 0 0 5px #e9ebf1,0 30px 60px rgba(0,0,0,.6)}
.bk::before,.bk::after{content:"";position:absolute;width:34px;height:34px;background:var(--silver);clip-path:polygon(0 0,100% 0,0 100%)}
.bk::before{left:-2px;top:-2px;border-top-left-radius:18px}
.bk::after{right:-2px;bottom:-2px;transform:rotate(180deg);border-top-left-radius:18px}
.bkHead{display:flex;align-items:center;gap:8px;flex:none;margin-bottom:8px}
.bkHead h2{margin:0 auto 0 4px;font:italic 700 24px var(--serif);letter-spacing:.15em;color:var(--gold);white-space:nowrap}
.bkHead h2 small{font:500 12px "Noto Sans TC";color:var(--mut);letter-spacing:0;margin-left:6px}
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;padding:7px 6px 6px;border-radius:12px 12px 0 0;font-weight:900;font-size:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.tab small{font:700 13px var(--serif);letter-spacing:.05em}
.tab.on{color:#fff;background:var(--tc);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tab[data-s="0"]{--tc:linear-gradient(160deg,#ff8cc0,#b22d66)} .tab[data-s="1"]{--tc:linear-gradient(160deg,#8fe3ff,#1f5fc4)} .tab[data-s="2"]{--tc:linear-gradient(160deg,#c9b2ff,#4b39a8)}
.book{position:relative;flex:1;min-height:0;display:flex;gap:0;perspective:2200px;border-radius:0 0 10px 10px;padding:10px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.page{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:12px;border-radius:8px;
  background:linear-gradient(180deg,#f5f1ea,#e9e3f0);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset 0 0 30px rgba(120,90,160,.15)}
.page.R{display:none}
.book.spread .page.R{display:grid}
.book.spread .page.L{border-radius:8px 2px 2px 8px;box-shadow:inset -14px 0 18px -10px rgba(60,30,90,.35)}
.book.spread .page.R{border-radius:2px 8px 8px 2px;box-shadow:inset 14px 0 18px -10px rgba(60,30,90,.35)}
.leaf{position:absolute;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;z-index:4}
.leaf .page{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid}
.leaf .page.bk2{transform:rotateY(180deg)}
.pnum{position:absolute;bottom:2px;font:italic 600 12px var(--serif);color:#8a7fab}
.page.L .pnum,.page .pnum{left:50%;transform:translateX(-50%)}
.slot{position:relative;min-width:0;min-height:0;border-radius:6px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(90,70,130,.18),inset 0 2px 4px rgba(90,70,130,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.slot .sn{position:absolute;top:3px;left:5px;font:700 13px var(--serif);color:#8a7fab}
.slot img{width:78%;height:62%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.slot .nm{font-size:12px;font-weight:700;color:#2b2150;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.slot.empty .q{font:700 26px var(--serif);color:rgba(90,70,130,.3)}
.slot.empty .nm{color:#a99fc6}
.slot.got{background:#fff;box-shadow:inset 0 0 0 2.5px var(--sf),0 2px 5px rgba(60,30,90,.2)}
.slot.got.t-common{--sf:#d9d3c7} .slot.got.t-rare{--sf:#9ba1b2} .slot.got.t-srare{--sf:#d8a94a}
.slot.got.t-legend{box-shadow:0 2px 5px rgba(60,30,90,.2)}
.slot.got.t-legend::before{content:"";position:absolute;inset:0;padding:2.5px;border-radius:6px;background:var(--rainbow);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.slot .sh{position:absolute;top:3px;right:5px;font-size:12px;color:#e0a400;font-weight:900}
.slot.showS{background:linear-gradient(135deg,#fff8e0,#ffe9f4 50%,#e6f5ff)}
.slot.showS .sh{color:#ff4fa3}
.slot.flash{animation:slFl .5s}
@keyframes slFl{40%{transform:scale(1.08)}}
.bkFoot{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:8px}
.pg{width:46px;height:40px;border-radius:12px;font-size:20px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.pg:disabled{opacity:.3}
#pgInfo{font:italic 700 18px var(--serif);color:#fff;min-width:90px;text-align:center}
.bkTip{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}

/* 卡片特寫 */
#zoom{background:rgba(6,4,18,.86)}
#zoom .zc{position:absolute;left:50%;top:46%}
#zoom .zt{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:13px;color:var(--mut)}
#zoom .zt b{display:block;color:#fff;font-size:18px;margin-bottom:4px}

/* 側欄（桌機） */
.side{display:none}
.panel{border-radius:14px;padding:10px 12px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line)}
.panel h3{margin:0 0 8px;font:italic 700 17px var(--serif);letter-spacing:.12em;color:var(--gold);display:flex;justify-content:space-between;align-items:baseline}
.panel h3 small{font:500 11px "Noto Sans TC";color:var(--mut);letter-spacing:0}
.setRow{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:8px;margin:6px 0;font-size:13px;font-weight:700}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bc);transition:width .6s}
.setRow span{font:700 15px var(--serif);color:var(--mut)}
.recentGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rc{position:relative;aspect-ratio:.72;border-radius:6px;padding:2px;background:#f6f3ec;overflow:hidden}
.rc.t-rare{background:var(--silver)} .rc.t-srare{background:var(--goldm)} .rc.t-legend{background:var(--rainbow)}
.rc div{height:100%;border-radius:4px;background:linear-gradient(180deg,#fffaf5,#ece6f4);display:flex;align-items:center;justify-content:center}
.rc img{width:92%;object-fit:contain}
.rc.s div{background:linear-gradient(135deg,#fff3c4,#ffd6ec 50%,#cdeeff)}
.rc.s::after{content:"✦";position:absolute;top:1px;right:4px;font-size:11px;color:#e0a400;font-weight:900}
.rc.in{animation:rcIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes rcIn{from{transform:scale(.3);opacity:0}}

/* 底列 */
.bottom{position:relative;z-index:5;flex:none;display:flex;align-items:center;gap:8px;margin:0 8px 8px;padding:6px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.auto{flex:none;height:46px;padding:0 16px;border-radius:13px;font-weight:900;font-size:15px;letter-spacing:1px;color:#fff;background:linear-gradient(135deg,var(--rose),#7a3df0 55%,var(--blue));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(232,70,124,.4)}
.auto:active{transform:scale(.96)}
.auto.run{animation:autoRun 1s linear infinite}
@keyframes autoRun{50%{filter:brightness(1.3)}}
.chain{flex:none;display:flex;align-items:center;gap:6px;height:46px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:700;color:var(--mut);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chain i{width:34px;height:20px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.chain i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.chain.on{color:#fff}
.chain.on i{background:var(--pink)}
.chain.on i::after{transform:translateX(14px)}
.strip{flex:1;min-width:0;display:flex;gap:5px;overflow:hidden;align-items:center;height:46px;-webkit-mask:linear-gradient(90deg,#000 80%,transparent);mask:linear-gradient(90deg,#000 80%,transparent)}
.strip .rc{flex:none;height:46px;width:auto}
.strip small{flex:none;font-size:11px;color:var(--mut);writing-mode:vertical-rl;letter-spacing:2px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#toast{position:fixed;left:50%;top:70px;z-index:50;transform:translate(-50%,-20px);opacity:0;transition:.3s;padding:8px 16px;border-radius:99px;background:rgba(20,12,44,.92);border:1px solid var(--gold);font-weight:700;font-size:14px;white-space:nowrap;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;z-index:35;background:#fff;opacity:0;pointer-events:none}

@media (max-width:560px){
  .brand b{font-size:14px}
  .brand small{font-size:10px;letter-spacing:2px}
  .hbtn span{display:none}
  .hbtn{padding:0 9px}
  .xy{width:28px;height:28px}
  .xy::after{inset:6px}
  .dexchip{padding:3px 7px}
  .dexchip small{display:none}
  .dexchip b{font-size:20px}
  .auto{padding:0 12px;font-size:14px}
  .tab{font-size:13px}
  .bkHead h2{font-size:20px}
  .page{gap:5px;padding:8px}
  .slot .nm{font-size:10.5px}
  .slot .sn{font-size:11px}
}
@media (max-width:430px){ .brand small{display:none} .brand b{font-size:13px;letter-spacing:0} .chain{padding:0 7px} .top{gap:6px} .ibtn,.hbtn{width:36px;height:36px} .hbtn{width:auto} }
@media (min-width:1000px){
  .main{padding:12px 14px}
  .side{display:flex;flex-direction:column;gap:10px;width:300px;flex:none}
  .side .recentGrid{overflow:hidden}
  .strip{display:none}
  .bottom{justify-content:center;background:none;border:0}
  .auto{height:52px;padding:0 34px;font-size:17px}
  .chain{height:52px}
  .counter{font-size:13px}
  .hint{font-size:14px;height:26px}
  .top{margin:12px 14px 0;padding:8px 12px}
  .brand b{font-size:19px}
}
</style>
</head>

    <path d="M94 60 L114 90 L90 120 L112 150 L88 180 M106 60 L86 90 L110 120 L88 150 L112 180 M82 220 L124 260 L74 300 L130 340 L66 376 M118 220 L76 260 L126 300 L70 340 L134 376 M58 400 L160 450 M142 400 L40 450 M48 480 L170 560 M152 480 L30 560"/>
